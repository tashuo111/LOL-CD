name: Build and release 1.9.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.9.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'

      - name: Test and build portable package
        shell: pwsh
        # Hosted Windows has no Chinese SAPI voice; this integration test passed locally.
        run: ./build.ps1 -SkipChineseVoiceTest

      - name: Upload both assets and publish release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $tag = 'v1.9.1'
          $repository = $env:GITHUB_REPOSITORY
          $api = "https://api.github.com/repos/$repository"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          # Include drafts in the lookup and leave every existing release untouched.
          $existing = $null
          $page = 1
          do {
            $response = Invoke-RestMethod -Method Get -Uri "$api/releases?per_page=100&page=$page" -Headers $headers
            $releases = @($response)
            $existing = $releases | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
            $page++
          } while ($null -eq $existing -and $releases.Count -eq 100)
          if ($null -ne $existing) {
            if ($existing.draft) {
              throw "An unfinished draft for $tag already exists. Review its assets before retrying; this workflow will not replace or delete it."
            }
            Write-Host "Release $tag is already published; skipping without replacing assets."
            exit 0
          }

          $packages = @(Get-ChildItem -LiteralPath 'artifacts' -Recurse -File -Filter 'Timer-1.9.1-win-x64.zip')
          if ($packages.Count -ne 1) { throw 'Expected exactly one package from the fresh build.' }
          $package = $packages[0]
          $checksum = Get-Item -LiteralPath (Join-Path $package.DirectoryName 'SHA256SUMS.txt')
          $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedChecksum = $hash + '  ' + $package.Name
          if ((Get-Content -LiteralPath $checksum.FullName -Raw).Trim() -ne $expectedChecksum) {
            throw 'Package checksum verification failed.'
          }

          $notes = @'
          当前个人备份最新版：闪现计时器 1.9.1，基于本仓库源码构建。

          完整解压 Windows 64 位便携包后，双击 Timer.exe，无需安装 .NET。
          Ctrl+主键盘1～5记录，X松开尝试发送，F7生成并复制；只输出正在冷却的记录。
          支持常规与海克斯大乱斗模式，记录时静音、到期播报；大乱斗176.47秒仅为本版预设，请按游戏内实际CD调整。

          用户已确认X在当前电脑能成功发送，但换另一台电脑失败；存在环境兼容性差异，具体原因待诊断。若X未打开聊天框，请使用F7后手动Enter、Ctrl+V、Enter。
          本机32项测试通过。云端运行31项测试；因托管机器没有中文SAPI语音引擎，中文发声集成测试仅在本机验证。这些测试不证明LOL游戏内发送成功。
          SHA256SUMS.txt可用于校验压缩包。来源、配置与其他限制见仓库README。
          '@
          $createBody = @{
            tag_name = $tag
            target_commitish = $env:GITHUB_SHA
            name = '闪现计时器 1.9.1 · Windows x64 便携版'
            body = $notes
            draft = $true
            prerelease = $false
          } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([System.Text.Encoding]::UTF8.GetBytes($createBody))

          # Keep the release a draft until both uploads have completed and been checked.
          $assets = @(
            @{ File = $package; ContentType = 'application/zip' },
            @{ File = $checksum; ContentType = 'text/plain' }
          )
          foreach ($asset in $assets) {
            $file = $asset.File
            $name = [Uri]::EscapeDataString($file.Name)
            $uploadUri = "https://uploads.github.com/repos/$repository/releases/$($release.id)/assets?name=$name"
            $uploaded = Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType $asset.ContentType -InFile $file.FullName
            if ($uploaded.name -ne $file.Name -or $uploaded.state -ne 'uploaded' -or $uploaded.size -ne $file.Length) {
              throw "Asset upload verification failed for $($file.Name); release remains a draft."
            }
          }
          $publishBody = @{ draft = $false; make_latest = 'true' } | ConvertTo-Json
          $published = Invoke-RestMethod -Method Patch -Uri "$api/releases/$($release.id)" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $publishBody
          if ($published.draft) { throw 'Release is still a draft after the publish request.' }
          Write-Host "Published: $($published.html_url)"
